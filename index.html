<!DOCTYPE html>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        
        body {
            font-family: 'Orbitron', sans-serif;
            background: url('images/kali.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #0e9fdd;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        
        .section {
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(19, 167, 212, 0.5);
            transition: transform 0.3s ease-in-out;
            margin: 20px;
            width: 90%;
            max-width: 800px;
        }
        
        .section:hover {
            transform: scale(1.05);
        }
        .profile-photo {
            width: 200px;
            height: 250px;
            position: fixed;
            top: 20px;
            right: 20px;
            animation: float 4s infinite ease-in-out;
            border-radius: 50% / 60%;
        }
        
        .projects ul {
            list-style: none;
            padding: 0;
        }
        
        .projects a {
            color: #9498ae;
            text-decoration: none;
            font-weight: bold;
        }
        
        .view-more {
            margin-top: 10px;
            cursor: pointer;
            color: #eef9ee;
            font-weight: bold;
            font-size: 1.2em;
        }
        
        .cv-download a {
            display: inline-block;
            background-color: #256dd2;
            color: black;
            padding: 10px 20px;
            font-size: 18px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        #tools-languages {
        padding: 20px;
        text-align: center;
    }

    #tools-languages h2 {
        font-size: 2em;
        margin-bottom: 20px;
    }

    #tools-languages h3 {
        font-size: 1.5em;
        margin-top: 30px;
    }

    .tools, .languages {
        display: flex;
        justify-content: center;
        gap: 30px;  /* Adds space between the icons */
        flex-wrap: wrap;
        margin-top: 10px;
    }

    .tools img, .languages img {
        width: 50px;
        height: 50px;
        transition: transform 0.3s ease;
    }

    .tools img:hover, .languages img:hover {
        transform: scale(1.2); /* Slight zoom on hover */
    }
    </style>
</head>
