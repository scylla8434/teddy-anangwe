<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teddy Anangwe</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Orbitron', sans-serif;
            background: url('images/kali.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #0e9fdd;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 250px;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            position: fixed;
            height: 100%;
        }

        .sidebar a {
            display: block;
            color: #0e9fdd;
            text-decoration: none;
            padding: 10px;
            margin: 10px 0;
            font-size: 18px;
        }

        .sidebar a:hover {
            background: #0e9fdd;
            color: black;
            border-radius: 5px;
        }

        .profile-photo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: block;
            margin: 0 auto 10px;
        }

        /* Main Content */
        .main-content {
            margin-left: 270px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: calc(100% - 270px);
            text-align: center;
            padding: 20px;
        }

        .section {
            display: none;
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(19, 167, 212, 0.5);
            width: 90%;
            max-width: 900px;
        }

        /* Skills Progress Bar */
        .progress-bar {
            background-color: #0e9fdd;
        }

        /* Project Hover Effect */
        .project img {
            width: 100px;
            height: 100px;
            transition: transform 0.3s ease-in-out;
        }
        .project img:hover {
            transform: scale(1.2);
            cursor: pointer;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                display: flex;
                justify-content: center;
                flex-wrap: wrap;
                text-align: center;
                padding: 10px;
            }

            .main-content {
                margin-left: 0;
                width: 100%;
            }

            .section {
                width: 95%;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <img src="images/tedd.jpg" alt="Profile Photo" class="profile-photo">
        <h3 class="text-white">Teddy Anangwe</h3>
        <a href="#about" onclick="showSection('about')">About</a>
        <a href="#skills" onclick="showSection('skills')">Skills</a>
        <a href="#projects" onclick="showSection('projects')">Projects</a>
        <a href="#contact" onclick="showSection('contact')">Contact</a>
        <a href="#cv" onclick="showSection('cv')">Download CV</a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div id="about" class="section" style="display: block;">
            <h1>About Me</h1>
            <p class="typing-effect"></p>
        </div>

        <div id="skills" class="section">
            <h2>Skills & Expertise</h2>
            <div class="mb-3">
                <label>PHP</label>
                <div class="progress"><div class="progress-bar" style="width: 90%;">90%</div></div>
            </div>
            <div class="mb-3">
                <label>React</label>
                <div class="progress"><div class="progress-bar" style="width: 85%;">85%</div></div>
            </div>
            <div class="mb-3">
                <label>Cloud Security (Azure & AWS)</label>
                <div class="progress"><div class="progress-bar" style="width: 80%;">80%</div></div>
            </div>
            <div class="mb-3">
                <label>Terraform & DevOps</label>
                <div class="progress"><div class="progress-bar" style="width: 75%;">75%</div></div>
            </div>
            <div class="mb-3">
                <label>Burp Suite</label>
                <div class="progress"><div class="progress-bar" style="width: 85%;">85%</div></div>
            </div>
            <div class="mb-3">
                <label>Metasploit</label>
                <div class="progress"><div class="progress-bar" style="width: 80%;">80%</div></div>
            </div>
        </div>

        <div id="projects" class="section">
            <h2>Projects</h2>
            <div class="project">
                <a href="https://example.com" target="_blank">
                    <img src="icons/esec.png" alt="eSecurity">
                    <p>eSecurity</p>
                </a>
            </div>
            <div class="project">
                <a href="https://example.com" target="_blank">
                    <img src="icons/ewshop.png" alt="eBay Clone">
                    <p>eBay Clone</p>
                </a>
            </div>
        </div>

        <div id="contact" class="section">
            
            h2>Contact Me</h2>
            <i class="fa fa-phone" style="font-size:24px"></i></i><a href="tel:254716711570">+254746711570</a><br>
            <i class="fa fa-envelope" style="font-size:24px"></i><a href="mailto:teddyanangwe@gmail.com">teddyanangwe@gmail.com</a><br>
            <i class="fa fa-linkedin-square" style="font-size:24px"></i> <a href="https://www.linkedin.com/in/amalemba-anangwe-a961b721b" target="_blank">amalemba</a><br>
            <i class="fa fa-github" style="font-size:24px"></i><a href="https://github.com/scylla8434" target="_blank">scylla8434</a>

              </div>

        <div id="cv" class="section">
            <h2>Download CV</h2>
            <a href="docs/teddy_anangwe_cv.pdf" download class="btn btn-primary">Download CV</a>
        </div>
    </div>

    <script>
        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(section => {
                section.style.display = 'none';
            });
            document.getElementById(sectionId).style.display = 'block';
        }

        document.addEventListener("DOMContentLoaded", function() {
            new Typed('.typing-effect', {
                strings: ["I'm Teddy Anangwe, a Cloud Security & DevOps Engineer specializing in Azure, AWS, and Web Development."],
                typeSpeed: 50,
                backSpeed: 25,
                loop: true
            });
        });
    </script>
</body>
</html>
